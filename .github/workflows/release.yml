name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag version matches Cargo.toml
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-14
            target: darwin-arm64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Rename binary
        shell: bash
        run: |
          cd target/release
          if [ -f opencase.exe ]; then
            mv opencase.exe opencase-${{ matrix.target }}.exe
          else
            mv opencase opencase-${{ matrix.target }}
          fi
      - name: Checksum
        if: runner.os != 'Windows'
        shell: bash
        run: cd target/release && shasum -a 256 opencase-${{ matrix.target }} > opencase-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: opencase-${{ matrix.target }}
          path: target/release/opencase-${{ matrix.target }}*

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io (idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -fsSL https://index.crates.io/op/en/opencase | grep -q '"vers":"'"$VERSION"'"'; then
            echo "opencase $VERSION already published — skipping"
          else
            cargo publish --locked
          fi

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
