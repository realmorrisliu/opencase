name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag version matches Cargo.toml
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-14
            target: darwin-arm64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Rename binary
        shell: bash
        run: |
          cd target/release
          if [ -f opencase.exe ]; then
            mv opencase.exe opencase-${{ matrix.target }}.exe
          else
            mv opencase opencase-${{ matrix.target }}
          fi
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && secrets.MACOS_CERT_P12 != '' && secrets.NOTARY_KEY != ''
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          cd target/release
          KEYCHAIN=opencase.keychain
          security create-keychain -p temp "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p temp "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ {print $2; exit}')
          codesign --force --options runtime --timestamp --sign "$IDENTITY" \
            opencase-${{ matrix.target }}
          echo "$NOTARY_KEY" | base64 --decode > notary.p8
          xcrun notarytool submit opencase-${{ matrix.target }} \
            --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          xcrun stapler staple opencase-${{ matrix.target }}
      - name: Checksum
        if: runner.os != 'Windows'
        shell: bash
        run: cd target/release && shasum -a 256 opencase-${{ matrix.target }} > opencase-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: opencase-${{ matrix.target }}
          path: target/release/opencase-${{ matrix.target }}*

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io (idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -fsSL https://index.crates.io/op/en/opencase | grep -q '"vers":"'$VERSION'"'; then
            echo "opencase $VERSION already published — skipping"
          else
            cargo publish --locked
          fi

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
