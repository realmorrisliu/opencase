name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Rename binary
        shell: bash
        run: |
          cd target/release
          if [ -f opencase.exe ]; then
            mv opencase.exe opencase-${{ matrix.target }}.exe
          else
            mv opencase opencase-${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: opencase-${{ matrix.target }}
          path: target/release/opencase-${{ matrix.target }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
